url: "https://ropenspain.github.io/rostemplate"

template:
  bootstrap: 5
  package: rostemplate
  opengraph:
    image:
      src: https://ropenspain.github.io/rostemplate/logo.png
      alt: "rOpenSpain logo"
    twitter:
      site: "@rOpenSpain"
      creator: "@dhernangomez"
      card: summary_large_image

reference:
- title: Sitios pkgdown
  desc: >
    Funciones para crear sitios pkgdown localmente o con workflows de
    GitHub Actions.
  contents:
  - has_concept("pkgdown")

- title: Comprobaciones con GitHub Actions
  desc: Workflows de GitHub Actions para comprobar paquetes de forma periódica.
  contents:
  - ros_actions_check_cron

- title: Identidad visual
  desc: Insignias y paletas de colores de rOpenSpain.
  contents:
  - ros_badge_ropenspain
  - has_concept("palettes")

- title: Sobre el paquete
  contents:
  - rostemplate-package

# Comprueba la configuración local en https://pkgdown.r-lib.org/articles/pkgdown.html#language
lang: es

# Optional
authors:
  Diego Hernangómez:
    href: https://github.com/dieghernan/

articles:
- title: Artículos
  navbar: Sobre rOpenSpain
  contents:
  - articles/descargas

- title: Ejemplos precomputados
  desc: >
    Artículos de ejemplo para comprobar vignettes precomputadas en R Markdown
    y Quarto.
  contents:
  - starts_with("precompute")

- title: Menú de pruebas
  navbar: Menú de pruebas
  desc: >
    Artículos de prueba para comprobar el menú de navegación.
  contents:
  - starts_with("menu")

- title: Test
  desc: >
    Artículos de prueba para comprobar la salida de pkgdown.
  contents:
  - starts_with("test")
