url: "https://ropenspain.github.io/rostemplate"

template:
  bootstrap: 5
  package: rostemplate
  opengraph:
    image:
      src: https://ropenspain.github.io/rostemplate/logo.png
      alt: "Logo de rOpenSpain"
    twitter:
      site: "@rOpenSpain"
      creator: "@dhernangomez"
      card: summary_large_image

reference:
- title: Sitios pkgdown
  desc: >
    Genera el sitio de forma local o instala un flujo de trabajo de
    **GitHub Actions** para publicarlo en `docs` o `gh-pages`.
- contents:
  - ros_build
  - ros_actions_pkgdown_docs
  - ros_actions_pkgdown_branch

- title: Comprobaciones con GitHub Actions
  desc: >
    Funciones para comprobar paquetes periódicamente mediante flujos de trabajo
    de **GitHub Actions**.
- contents:
  - has_concept("github_actions")
  - -has_concept("pkgdown")

- title: Identidad visual
  desc: Insignias y paletas de colores de **rOpenSpain**.
- contents:
  - ros_badge_ropenspain
  - has_concept("palettes")

- title: Sobre el paquete
  desc: Información general, autoría y enlaces del paquete.
- contents:
  - rostemplate-package

# Comprueba la configuración local en https://pkgdown.r-lib.org/articles/pkgdown.html#language
lang: es

# Opcional
authors:
  Diego Hernangómez:
    href: https://github.com/dieghernan/

articles:
- title: Uso de la plantilla
  navbar: ~
  desc: Configura la plantilla de **rOpenSpain** para tu sitio **pkgdown**.
  contents:
  - rostemplate

- title: Comunidad rOpenSpain
  navbar: Sobre rOpenSpain
  desc: Consulta las descargas de paquetes de **rOpenSpain**.
  contents:
  - articles/descargas

- title: Ejemplos precomputados
  desc: >
    Artículos de ejemplo para comprobar viñetas precomputadas en **R Markdown**
    y **Quarto**.
  contents:
  - precompute
  - precompute-quarto

- title: Menú de pruebas
  navbar: Menú de pruebas
  desc: >
    Artículos de prueba para comprobar el menú de navegación.
  contents:
  - starts_with("menu/")

- title: Pruebas de renderizado
  desc: >
    Comprueba bloques de código, figuras, tablas, widgets y otros elementos
    de **R Markdown** en **pkgdown**.
  contents:
  - starts_with("test/")
  - -starts_with("test/quarto-")

- title: Pruebas de Quarto
  desc: >
    Comprueba las funciones de **Quarto** y su integración con **pkgdown**.
  contents:
  - test-quarto
  - test/quarto-features
