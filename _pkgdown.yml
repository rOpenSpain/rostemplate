url: "https://ropenspain.github.io/rostemplate"

template:
  bootstrap: 5
  package: rostemplate
  opengraph:
    image:
      src: https://ropenspain.github.io/rostemplate/logo.png
      alt: "Logo de rOpenSpain"
    twitter:
      site: "@rOpenSpain"
      creator: "@dhernangomez"
      card: summary_large_image

reference:
- title: Sitios pkgdown
  desc: >
    Funciones para crear sitios **pkgdown** localmente o mediante flujos de
    trabajo de **GitHub Actions**.
  contents:
  - has_concept("pkgdown")

- title: Comprobaciones con GitHub Actions
  desc: >
    Funciones para comprobar paquetes periódicamente mediante flujos de trabajo
    de **GitHub Actions**.
  contents:
  - has_concept("github_actions")
  - -has_concept("pkgdown")

- title: Identidad visual
  desc: Insignias y paletas de colores de **rOpenSpain**.
  contents:
  - has_concept("branding")

- title: Sobre el paquete
  desc: Información general, autoría y enlaces del paquete.
  contents:
  - rostemplate-package

# Comprueba la configuración local en https://pkgdown.r-lib.org/articles/pkgdown.html#language
lang: es

# Opcional
authors:
  Diego Hernangómez:
    href: https://github.com/dieghernan/

articles:
- title: Comunidad rOpenSpain
  navbar: Sobre rOpenSpain
  desc: Artículos sobre los paquetes y la actividad de **rOpenSpain**.
  contents:
  - articles/descargas

- title: Ejemplos precomputados
  desc: >
    Artículos de ejemplo para comprobar viñetas precomputadas en **R Markdown**
    y **Quarto**.
  contents:
  - starts_with("precompute")

- title: Menú de pruebas
  navbar: Menú de pruebas
  desc: >
    Artículos de prueba para comprobar el menú de navegación.
  contents:
  - starts_with("menu")

- title: Pruebas de renderizado
  desc: >
    Artículos de prueba para comprobar la salida de **pkgdown**.
  contents:
  - starts_with("test")
